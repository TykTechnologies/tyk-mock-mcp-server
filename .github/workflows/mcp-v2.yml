name: MCP fixture validation
on:
  pull_request:
    branches: [main, 'TT-*-v2-*']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Record dependencies and test fixtures
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          go list -m all > artifacts/modules.txt
          go mod verify
          go test -json -race -count=1 ./... > artifacts/tests.json 2>&1
      - name: Produce JUnit
        if: always()
        run: go run gotest.tools/gotestsum@v1.12.0 --junitfile artifacts/tests.xml --raw-command cat artifacts/tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-fixture-validation
          retention-days: 30
          path: artifacts/
