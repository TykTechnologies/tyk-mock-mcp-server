version: '3'

vars:
  BINARY_NAME: tyk-mock-mcp-server
  DOCKER_IMAGE: tyk-mock-mcp-server
  DOCKER_TAG: latest

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install Go dependencies
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build the server binary
    deps: [install]
    cmds:
      - go build -o {{.BINARY_NAME}} .
    generates:
      - "{{.BINARY_NAME}}"

  run:
    desc: Run the server locally
    deps: [build]
    cmds:
      - ./{{.BINARY_NAME}}

  dev:
    desc: Run the server directly with go run
    cmds:
      - go run main.go

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  lint:
    desc: Run linter (requires golangci-lint)
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -f coverage.out coverage.html
      - go clean

  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} .

  docker-run:
    desc: Run Docker container
    deps: [docker-build]
    cmds:
      - docker run --rm -p 7878:7878 --name {{.BINARY_NAME}} {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}

  docker-stop:
    desc: Stop Docker container
    cmds:
      - docker stop {{.BINARY_NAME}}

  docker-clean:
    desc: Remove Docker image
    cmds:
      - docker rmi {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test

  all:
    desc: Run fmt, vet, build, and test
    cmds:
      - task: fmt
      - task: vet
      - task: build
      - task: test
